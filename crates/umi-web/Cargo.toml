[package]
name = "umi-web"
description = "Umi's editor in the browser: the editor session (umi-editor) and the GPU renderer (umi-render, on WebGPU), for WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
umi-editor = { path = "../umi-editor" }
umi-project.workspace = true
umi-render = { path = "../umi-render" }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["rng-getrandom"] }
getrandom = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["OffscreenCanvas", "ImageBitmap", "HtmlVideoElement", "HtmlCanvasElement", "VideoFrame", "HtmlImageElement", "console"] }
# WebGPU where the browser has it, WebGL2 elsewhere (older or weaker graphics).
wgpu = { version = "30", features = ["webgl"] }
gif = "0.14"

[lints]
workspace = true
