[package]
name = "umi-engine"
description = "Timeline playback and export: decodes sources, renders frames, mixes audio."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
umi-project.workspace = true
umi-render = { path = "../umi-render" }
umi-media = { path = "../umi-media" }
thiserror.workspace = true
uuid.workspace = true
parking_lot = "0.12"
crossbeam-channel = "0.5"
nnnoiseless = { version = "0.5", default-features = false }
tracing.workspace = true

# Export threads run at a lower priority, so the computer stays responsive while exporting.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true

[lints]
workspace = true
