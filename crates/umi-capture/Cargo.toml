[package]
name = "umi-capture"
description = "Capturing what's being recorded: screen, system sound, microphone, camera, and cursor/clicks/keys. Raw frames and samples out; encoding lives elsewhere."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.18"
umi-project.workspace = true
nokhwa = { version = "0.10", features = ["input-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11.1", features = ["macos_13_0"] }
readmouse = "0.2"
readkey = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
device_query = "4"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"

[lints]
workspace = true

[dev-dependencies]
umi-media = { path = "../umi-media" }
