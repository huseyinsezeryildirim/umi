[package]
name = "umi-desktop"
description = "Umi for macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "umi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
trash = "5"
ureq = { version = "3", features = ["json"] }
chrono.workspace = true
umi-project.workspace = true
umi-render = { path = "../../../crates/umi-render" }
umi-media = { path = "../../../crates/umi-media" }
umi-engine = { path = "../../../crates/umi-engine" }
umi-ai = { path = "../../../crates/umi-ai" }
umi-capture = { path = "../../../crates/umi-capture" }
umi-recorder = { path = "../../../crates/umi-recorder" }
umi-cloud = { path = "../../../crates/umi-cloud" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints]
workspace = true
