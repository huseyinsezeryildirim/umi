name: Deploy Umi Cloud

# The share-link backend (web/, a Cloudflare Worker with D1 and R2).
# Every push to main that touches web/ goes to staging; a version tag (or a manual run, which waits
# for the production environment's reviewers) goes to production. D1 migrations run before the deploy.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-cloud.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-cloud-${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
      url: ${{ vars.API_URL }}
    env:
      TARGET: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Until the setup in docs/DEVOPS.md is done, deploys are skipped with a notice instead of failing.
      - name: Ready to deploy?
        id: ready
        run: |
          ready=true
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the '$TARGET' environment (docs/DEVOPS.md)."
            ready=false
          fi
          id=$(node -e '
            const src = require("fs").readFileSync("wrangler.jsonc", "utf8");
            const cfg = JSON.parse(src.replace(/^\s*\/\/.*$/gm, "").replace(/,(\s*[}\]])/g, "$1"));
            console.log(cfg.env[process.env.TARGET].d1_databases[0].database_id);')
          if [ "$id" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "::warning file=web/wrangler.jsonc::Skipped: put the '$TARGET' database_id (from 'wrangler d1 create') into web/wrangler.jsonc."
            ready=false
          fi
          echo "ok=$ready" >> "$GITHUB_OUTPUT"
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: npx tsc --noEmit
      - name: Apply D1 migrations
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"
      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy --env "$TARGET" --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
      - name: Health check
        if: steps.ready.outputs.ok == 'true' && vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "${API_URL%/}/healthz" | grep -q '"ok":true'; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::${API_URL%/}/healthz did not answer {\"ok\":true} after the deploy."
          exit 1
