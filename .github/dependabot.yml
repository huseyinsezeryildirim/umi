# Monthly dependency updates, grouped, minor and patch only (major versions are upgraded by hand).
# Every PR runs the full CI matrix, and on a private repository macOS minutes count 10x and Windows 2x,
# so this stays at one PR per ecosystem and month. Security updates still arrive whenever they're published.
# Paused (open-pull-requests-limit: 0) while GitHub Actions is off; set it back to 1 to resume.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      rust:
        patterns: ["*"]

  # The pnpm workspace (desktop UI, site, packages/*).
  - package-ecosystem: npm
    directory: /
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      js:
        patterns: ["*"]

  # The Cloudflare Worker (npm, web/package-lock.json).
  - package-ecosystem: npm
    directory: /web
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    groups:
      cloud:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
