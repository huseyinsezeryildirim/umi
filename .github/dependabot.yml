# Monthly dependency updates, grouped, minor and patch only (major versions are upgraded by hand).
# Every PR runs the full CI matrix (free on a public repository, but slow),
# so this stays at one PR per ecosystem and month. Security updates still arrive whenever they're published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      rust:
        patterns: ["*"]

  # The pnpm workspace (desktop UI, site, packages/*).
  - package-ecosystem: npm
    directory: /
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      js:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
