[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/huseyinsezeryildirim/umi"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
tracing = "0.1"
umi-project = { path = "crates/umi-project" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# Build scripts (binding generators) run faster and use less stack optimized.
[profile.release.build-override]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
